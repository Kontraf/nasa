<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Space Explorer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel για εκτέλεση JSX απευθείας στον browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_KEY = 'DEMO_KEY'; // Μπορείς να βάλεις το δικό σου key από το api.nasa.gov

    function App() {
      const [activeTab, setActiveTab] = useState('apod');

      // --- APOD State ---
      const [apodData, setApodData] = useState(null);
      const [apodDate, setApodDate] = useState(new Date().toISOString().split('T')[0]);
      const [apodLoading, setApodLoading] = useState(true);

      // --- Mars Rover State ---
      const [selectedRover, setSelectedRover] = useState('curiosity');
      const [marsPhotos, setMarsPhotos] = useState([]);
      const [marsLoading, setMarsLoading] = useState(false);

      // --- Favorites State ---
      const [favorites, setFavorites] = useState(() => {
        const saved = localStorage.getItem('nasa_favorites');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        localStorage.setItem('nasa_favorites', JSON.stringify(favorites));
      }, [favorites]);

      // Fetch APOD
      useEffect(() => {
        async function fetchApod() {
          setApodLoading(true);
          try {
            const res = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&date=${apodDate}`);
            const data = await res.json();
            setApodData(data);
          } catch (err) {
            console.error("Error fetching APOD:", err);
          } finally {
            setApodLoading(false);
          }
        }
        fetchApod();
      }, [apodDate]);

      // Fetch Mars Rover Photos
      useEffect(() => {
        if (activeTab !== 'mars') return;
        async function fetchMars() {
          setMarsLoading(true);
          try {
            const res = await fetch(`https://api.nasa.gov/mars-photos/api/v1/rovers/${selectedRover}/photos?sol=1000&api_key=${API_KEY}`);
            const data = await res.json();
            setMarsPhotos(data.photos ? data.photos.slice(0, 12) : []);
          } catch (err) {
            console.error("Error fetching Mars photos:", err);
          } finally {
            setMarsLoading(false);
          }
        }
        fetchMars();
      }, [selectedRover, activeTab]);

      const toggleFavorite = (item) => {
        const exists = favorites.some((fav) => fav.url === item.url);
        if (exists) {
          setFavorites(favorites.filter((fav) => fav.url !== item.url));
        } else {
          setFavorites([...favorites, item]);
        }
      };

      const isFavorite = (url) => favorites.some((fav) => fav.url === url);

      return (
        <div className="min-h-screen pb-12">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🚀</span>
                <h1 className="text-xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                  NASA Space Explorer
                </h1>
              </div>
              
              <nav className="flex gap-2 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50">
                <button
                  onClick={() => setActiveTab('apod')}
                  className={`px-4 py-1.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'apod' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Picture of the Day
                </button>
                <button
                  onClick={() => setActiveTab('mars')}
                  className={`px-4 py-1.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'mars' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Mars Rovers
                </button>
                <button
                  onClick={() => setActiveTab('favorites')}
                  className={`px-4 py-1.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'favorites' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Favorites ({favorites.length})
                </button>
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-6xl mx-auto px-4 py-8">
            {/* TAB 1: APOD */}
            {activeTab === 'apod' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 p-4 rounded-xl border border-slate-800">
                  <div>
                    <h2 className="text-lg font-semibold text-cyan-400">Astronomy Picture of the Day</h2>
                    <p className="text-xs text-slate-400">Επίλεξε ημερομηνία για να δεις παλαιότερες φωτογραφίες</p>
                  </div>
                  <input
                    type="date"
                    value={apodDate}
                    max={new Date().toISOString().split('T')[0]}
                    onChange={(e) => setApodDate(e.target.value)}
                    className="bg-slate-800 border border-slate-700 text-white px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                  />
                </div>

                {apodLoading ? (
                  <div className="h-96 flex items-center justify-center text-slate-500">Φόρτωση δεδομένων NASA...</div>
                ) : apodData ? (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                    {apodData.media_type === 'image' ? (
                      <div className="relative group">
                        <img src={apodData.url} alt={apodData.title} className="w-full max-h-[600px] object-cover" />
                        <button
                          onClick={() => toggleFavorite({ title: apodData.title, url: apodData.url, date: apodData.date })}
                          className="absolute top-4 right-4 bg-slate-950/80 hover:bg-slate-900 text-white p-3 rounded-full border border-slate-700 transition"
                        >
                          {isFavorite(apodData.url) ? '❤️' : '🤍'}
                        </button>
                      </div>
                    ) : (
                      <iframe src={apodData.url} title={apodData.title} className="w-full h-[500px]" />
                    )}
                    <div className="p-6 space-y-4">
                      <div className="flex items-center justify-between text-xs text-slate-400">
                        <span>📅 {apodData.date}</span>
                        {apodData.copyright && <span>© {apodData.copyright}</span>}
                      </div>
                      <h3 className="text-2xl font-bold text-white">{apodData.title}</h3>
                      <p className="text-slate-300 text-sm leading-relaxed">{apodData.explanation}</p>
                    </div>
                  </div>
                ) : null}
              </div>
            )}

            {/* TAB 2: MARS ROVERS */}
            {activeTab === 'mars' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-800">
                  <h2 className="text-lg font-semibold text-cyan-400">Mars Rover Photos</h2>
                  <select
                    value={selectedRover}
                    onChange={(e) => setSelectedRover(e.target.value)}
                    className="bg-slate-800 border border-slate-700 text-white px-3 py-1.5 rounded-lg text-sm focus:outline-none"
                  >
                    <option value="curiosity">Curiosity</option>
                    <option value="perseverance">Perseverance</option>
                    <option value="opportunity">Opportunity</option>
                  </select>
                </div>

                {marsLoading ? (
                  <div className="h-96 flex items-center justify-center text-slate-500">Εξερεύνηση Άρη...</div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {marsPhotos.map((photo) => (
                      <div key={photo.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden group">
                        <div className="relative aspect-square">
                          <img src={photo.img_src} alt="Mars Rover" className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                          <button
                            onClick={() => toggleFavorite({ title: `${photo.rover.name} -${photo.camera.full_name}`, url: photo.img_src, date: photo.earth_date })}
                            className="absolute top-2 right-2 bg-slate-950/80 p-2 rounded-full border border-slate-700 text-xs"
                          >
                            {isFavorite(photo.img_src) ? '❤️' : '🤍'}
                          </button>
                        </div>
                        <div className="p-3 text-xs text-slate-400 space-y-1">
                          <p className="font-semibold text-slate-200">{photo.camera.full_name}</p>
                          <p>📅 {photo.earth_date} (Sol {photo.sol})</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: FAVORITES */}
            {activeTab === 'favorites' && (
              <div className="space-y-6">
                <h2 className="text-lg font-semibold text-cyan-400">Αποθηκευμένες Φωτογραφίες</h2>
                {favorites.length === 0 ? (
                  <div className="text-center py-20 text-slate-500">
                    Δεν έχεις αποθηκεύσει ακόμα αγαπημένες φωτογραφίες.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {favorites.map((fav, index) => (
                      <div key={index} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                        <div className="relative aspect-square">
                          <img src={fav.url} alt={fav.title} className="w-full h-full object-cover" />
                          <button
                            onClick={() => toggleFavorite(fav)}
                            className="absolute top-2 right-2 bg-slate-950/80 p-2 rounded-full border border-slate-700 text-xs"
                          >
                            ❌
                          </button>
                        </div>
                        <div className="p-3 text-xs text-slate-400">
                          <p className="font-semibold text-slate-200 truncate">{fav.title}</p>
                          <p>📅 {fav.date}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
